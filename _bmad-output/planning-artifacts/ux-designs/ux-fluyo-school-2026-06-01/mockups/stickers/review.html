<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluyo School Sticker Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 42px; background: #f7f4ed; color: #172e28; font-family: Inter, Arial, sans-serif; }
    h1 { margin: 0 0 8px; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: 56px; letter-spacing: -.02em; text-transform: uppercase; }
    p { max-width: 760px; margin: 0 0 30px; color: #59645f; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    article { min-height: 280px; padding: 18px; background-color: #fffefb; background-image: linear-gradient(45deg, #f1eee7 25%, transparent 25%), linear-gradient(-45deg, #f1eee7 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1eee7 75%), linear-gradient(-45deg, transparent 75%, #f1eee7 75%); background-position: 0 0, 0 10px, 10px -10px, -10px 0; background-size: 20px 20px; box-shadow: 7px 7px 0 #ee72df; }
    img { display: block; width: 100%; height: 215px; object-fit: contain; }
    strong { display: block; padding-top: 11px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Decorative Sticker Family</h1>
  <p>Transparent preview assets for selective placement across the landing page. The checkerboard is a review background only.</p>
  <section class="grid">
    <article><img src="megaphone.png" alt="Megaphone sticker"><strong>Megaphone</strong></article>
    <article><img src="hand-marker.png" alt="Hand holding a marker sticker"><strong>Hand holding a marker</strong></article>
    <article><img src="headphones.png" alt="Headphones sticker"><strong>Headphones</strong></article>
    <article><img src="open-book.png" alt="Open book sticker"><strong>Open book</strong></article>
    <article><img src="globe.png" alt="Globe sticker"><strong>Globe</strong></article>
  </section>
</body>
</html>
